apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zymtrace.resourceName" (list $ "auth-secrets") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zymtrace.labels" . | nindent 4 }}
type: Opaque
{{- /*
Use `data` rather than `stringData`: with server-side apply, field ownership of
`stringData` keys is not mapped onto the server-side `data` field, so keys that
disappear from the manifest (e.g. when auth.type changes) are orphaned in the
live Secret instead of pruned. Stale keys like
WEB__AUTH__VALIDATION__PUBLIC_KEY__CONTENT then leak into service environments
and break config parsing.
*/}}
data:
  # License keys
  {{- if and .Values.global.licenseKey (not .Values.global.licenseKeySecretName) }}
  WEB__LICENSE__KEY: {{ .Values.global.licenseKey | toString | b64enc }}
  INGEST__LICENSE__KEY: {{ .Values.global.licenseKey | toString | b64enc }}
  {{- end }}

  # Basic auth credentials
  {{- if eq (include "zymtrace.authType" .) "basic" }}
  UI_USER: {{ .Values.auth.basic.username | toString | b64enc }}
  UI_PASSWORD: {{ .Values.auth.basic.password | toString | b64enc }}
  {{- end }}

  {{- if or (eq (include "zymtrace.authType" .) "oidc") (eq (include "zymtrace.authType" .) "local") }}
  # Admin credentials
  {{- if not .Values.auth.admin.passwordSecretName }}
  IDENTITY__AUTH__ADMIN__PASSWORD: {{ .Values.auth.admin.password | toString | b64enc }}
  {{- end }}

  {{- $keys := .Values.auth.validation.keys }}
  {{- if and $keys.privateKey (not $keys.privateKeySecretName) }}
  # Token signing keys
  IDENTITY__AUTH__TOKEN__PRIVATE_KEY__CONTENT: {{ $keys.privateKey | b64enc }}
  {{- end }}
  {{- if and $keys.publicKey (not $keys.publicKeySecretName) }}
  IDENTITY__AUTH__TOKEN__PUBLIC_KEY__CONTENT: {{ $keys.publicKey | b64enc }}
  WEB__AUTH__VALIDATION__PUBLIC_KEY__CONTENT: {{ $keys.publicKey | b64enc }}
  {{- end }}
  {{- end }}

  {{- if eq (include "zymtrace.authType" .) "oidc" }}
  # OIDC client credentials
  IDENTITY__AUTH__OIDC__CLIENT_ID: {{ .Values.auth.oidc.provider.clientId | toString | b64enc }}
  {{- if not .Values.auth.oidc.provider.clientSecretSecretName }}
  IDENTITY__AUTH__OIDC__CLIENT_SECRET: {{ .Values.auth.oidc.provider.clientSecret | toString | b64enc }}
  {{- end }}
  {{- end }}
